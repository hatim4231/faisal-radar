name: رادار فيصل وعبدالله - مسح السوق (فرع تشخيص)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "diag script"
        default: "diag/backtest_features.py"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python "${{ inputs.script }}"
