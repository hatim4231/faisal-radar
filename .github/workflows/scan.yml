name: رادار فيصل وعبدالله - مسح السوق (فرع تشخيص)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python diag/sec_check.py ELPW,VRAX,NCT
