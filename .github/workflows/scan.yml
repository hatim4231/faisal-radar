name: رادار فيصل وعبدالله - مسح السوق

on:
  schedule:
    # بتوقيت UTC، من الاثنين للجمعة (السوق الأمريكي)
    - cron: "17 12 * * 1-5"         # قبل الافتتاح (بري ماركت)
    - cron: "17,47 13-21 * * 1-5"   # كل 30 دقيقة وقت السوق (قرار المستخدم: الخيار 4)
    - cron: "37 22 * * 1-5"         # بعد الإغلاق
    - cron: "22 1 * * 2-6"          # بعد ما يخلص الأفتر (رادار الأفتر)
    - cron: "52 2 * * 2-6"          # احتياط للأفتر (GitHub أحياناً يسقط التشغيل المجدول — صار ليلة 6 نوفمبر)
    - cron: "22 4 * * 2-6"          # احتياط ثاني للأفتر (التسجيل ما يتكرر لنفس السهم ونفس اليوم)
  workflow_dispatch:          # زر Run workflow للتحديث اليدوي (حتى من الجوال)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RADAR_PASSWORD: ${{ secrets.RADAR_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: كاش بيانات الشركات (يسرّع المسح)
        uses: actions/cache@v4
        with:
          path: cache
          key: info-${{ github.run_id }}
          restore-keys: info-

      - name: سجل التوصيات (فرع track-data)
        run: |
          git fetch origin track-data:track-data 2>/dev/null && git worktree add trackdata track-data \
            || { git worktree add --orphan -b track-data trackdata && echo '{"trades": []}' > trackdata/track.json; }

      - name: المسح
        run: |
          python scanner.py --no-open --out site/index.html
          cp output/latest.json output/sig_faisal_dev.json

      - name: نسخ ملف Excel (فقط إذا الموقع بدون كلمة سر)
        if: env.RADAR_PASSWORD == ''
        run: cp output/latest.csv site/latest.csv

      - name: رادار عبدالله
        run: python abdullah/abdullah_scanner.py --no-open --out site/abdullah/index.html

      - name: رادار فيصل — النسخة الأصلية
        run: |
          python faisal_original/run_original.py --out site/original/index.html
          cp output/latest.json output/sig_faisal_orig.json

      - name: رادار المطّلعين
        run: python insiders/insiders_scanner.py --out site/insiders/index.html

      - name: رادار التجميع
        run: python accumulation/accum_scanner.py --out site/accumulation/index.html

      - name: رادار الأفتر (صامت)
        run: python afterhours/ah_scanner.py --out site/afterhours/index.html || echo "رادار الأفتر تعطل — نكمل"

      - name: رادار المدارس (تجريبي — بالسجل بدون تيليجرام)
        run: python schools_radar/schools_scanner.py --out site/schools/index.html || echo "رادار المدارس تعطل — نكمل"

      - name: رادار الطيارات (تجريبي — بالسجل بدون تيليجرام)
        run: python runners_radar/runners_scanner.py --out site/runners/index.html || echo "رادار الطيارات تعطل — نكمل"

      - name: رادار عالي مخاطرة (تجريبي — بالسجل بدون تيليجرام، بدون فلاتر)
        run: python highrisk_radar/highrisk_scanner.py --out site/highrisk/index.html || echo "رادار عالي مخاطرة تعطل — نكمل"

      - name: رادار الجاهزة (يرتب فيصل + عبدالله ← تيليجرام يرسل بس الجاهزة)
        run: python ready_radar/ready_scanner.py --out site/ready/index.html || echo "رادار الجاهزة تعطل — نكمل"

      - name: متابعة التوصيات + تيليجرام
        run: python tracker.py

      - name: حفظ السجل
        run: |
          cd trackdata
          git config user.name "Faisal Radar"
          git config user.email "hatim423@hotmail.com"
          git add -A
          git commit -q -m "تحديث سجل التوصيات $(date -u +%F_%H%M)" || echo "لا تغيير"
          git push -q origin track-data

      - name: ملفات مشتركة للموقع (خط أعلام الدول لويندوز)
        run: mkdir -p site && cp -r assets site/

      - name: قفل الموقع بكلمة سر (إذا موجودة في Secrets باسم RADAR_PASSWORD)
        if: env.RADAR_PASSWORD != ''
        run: |
          SALT=$(printf '%s' "$RADAR_PASSWORD" | sha256sum | cut -c1-32)
          OPTS=(-p "$RADAR_PASSWORD" --short -s "$SALT" --remember 60 --config false
                --template-placeholder "كلمة السر" --template-remember "تذكرني على هذا الجهاز"
                --template-button "دخول" --template-error "كلمة السر غلط"
                --template-color-primary "#2f6fde" --template-color-secondary "#0e1013")
          npx --yes staticrypt@3.5.4 site/index.html "${OPTS[@]}" --template-title "📡 رادار فيصل" -d site
          if [ -f site/ready/index.html ]; then
            npx --yes staticrypt@3.5.4 site/ready/index.html "${OPTS[@]}" --template-title "🎯 الجاهزة" -d site/ready
          fi
          npx --yes staticrypt@3.5.4 site/abdullah/index.html "${OPTS[@]}" --template-title "🌊 رادار عبدالله" -d site/abdullah
          npx --yes staticrypt@3.5.4 site/original/index.html "${OPTS[@]}" --template-title "📜 فيصل الأصلي" -d site/original
          npx --yes staticrypt@3.5.4 site/track/index.html "${OPTS[@]}" --template-title "📈 سجل التوصيات" -d site/track
          npx --yes staticrypt@3.5.4 site/insiders/index.html "${OPTS[@]}" --template-title "🟢 رادار المطّلعين" -d site/insiders
          npx --yes staticrypt@3.5.4 site/accumulation/index.html "${OPTS[@]}" --template-title "🔍 رادار التجميع" -d site/accumulation
          if [ -f site/afterhours/index.html ]; then
            npx --yes staticrypt@3.5.4 site/afterhours/index.html "${OPTS[@]}" --template-title "🌙 رادار الأفتر" -d site/afterhours
          fi
          if [ -f site/schools/index.html ]; then
            npx --yes staticrypt@3.5.4 site/schools/index.html "${OPTS[@]}" --template-title "🧭 رادار المدارس" -d site/schools
          fi
          if [ -f site/runners/index.html ]; then
            npx --yes staticrypt@3.5.4 site/runners/index.html "${OPTS[@]}" --template-title "🚀 رادار الطيارات" -d site/runners
          fi
          if [ -f site/highrisk/index.html ]; then
            npx --yes staticrypt@3.5.4 site/highrisk/index.html "${OPTS[@]}" --template-title "🧨 رادار عالي مخاطرة" -d site/highrisk
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
